# =============================================================================
# 공고 수집기 설정 파일
# -----------------------------------------------------------------------------
# 이 파일 하나만 고치면 됩니다. API 키와 서비스 계정 키는 여기에 적지 말고
# GitHub Secrets(또는 로컬 .env)에 넣으세요. → README.md "설정" 참고
#
# 값 우선순위: 환경변수 > 이 파일 > 코드 기본값
# =============================================================================

# ---------------------------------------------------------------------------
# 1. 결과를 기록할 Google 스프레드시트
#    - 시트 URL 전체를 붙여넣어도 되고, ID만 적어도 됩니다.
#    - 서비스 계정 이메일(client_email)에 "편집자" 권한으로 공유해야 합니다.
# ---------------------------------------------------------------------------
spreadsheet: "https://docs.google.com/spreadsheets/d/여기에_스프레드시트_ID/edit"

# ---------------------------------------------------------------------------
# 2. 검색어
#    공고 "제목"만 검사합니다 (상세 내용은 검색 대상이 아님). 띄어쓰기·대소문자 무시.
#    아래 항목을 위에서부터 순서대로 판정합니다.
# ---------------------------------------------------------------------------
keywords:
  # 일반: 제목에 하나라도 있으면 수집하는 검색어
  general:
    - 스타트업
    - 창업
    - 벤처
    - 액셀러레이터
    - 사업화
    - 주관기관
    - 수행기관

  # 끝부분: 제목이 이 단어로 끝나면 무조건 수집하는 검색어
  #   예) 운영 용역 사업을 빠짐없이 확인하고 싶음 > "운영용역"
  ends_with:
    - 운영용역

  # 조건부: 위 검색어들과 함께 등장하지 않으면 수집하지 않는 검색어
  #   예) 소셜벤처 육성 사업을 수집하고 싶은데 "소셜"만 넣으면 육성과 무관한 사업까지
  #       수집될 우려가 있음 > "소셜" (일반 검색어 "육성"과 같이 있을 때만 수집)
  conditional:
    - 소상공인
    - 활성화

  # (고급) 필수: 있으면 무조건 수집하고, 아래 금지어가 있어도 "(필터)" 탭에 남기는 검색어
  #   예) "수행기관 모집 및 참가기업 모집"처럼 핵심 단어와 금지어가 한 제목에 같이 오는 경우
  # must:
  #   - 수행기관

# ---------------------------------------------------------------------------
# 3. 금지어 (제목에 포함되면 "(필터)" 탭에서 제외, 원본 탭에는 남김)
# ---------------------------------------------------------------------------
exclusion_keywords:
  - 참가자모집
  - 입주기업

# ---------------------------------------------------------------------------
# 4. 기간 기준
# ---------------------------------------------------------------------------
# 수집 기준일 수: 마감까지 최소 며칠 남아야 수집할지
#   예) 7 > 마감이 7일 미만 남은 공고는 수집X. 시트에 있던 공고도 이 기준 미만이 되면 자동 삭제
min_days_remaining: 7

# 공고 수집 범위: 며칠 전에 게시된 공고까지 볼지
#   예) 30 > 검색일로부터 30일 이전에 게시된 옛날 공고는 수집X (클수록 느려짐, 30~90 권장)
search_days_back: 30

# ---------------------------------------------------------------------------
# 5. 수집 소스
# ---------------------------------------------------------------------------
sources:
  nara:                        # 나라장터 (조달청 입찰공고)
    enabled: true
  kstartup:                    # K-Startup (창업진흥원 지원사업 공고)
    enabled: true

# ---------------------------------------------------------------------------
# 6. 시트 탭 이름
# ---------------------------------------------------------------------------
sheets:
  nara: "나라장터"
  kstartup: "K-Startup"
  nara_filtered: "나라장터(필터)"
  kstartup_filtered: "K-Startup(필터)"

# ---------------------------------------------------------------------------
# 7. 기타
# ---------------------------------------------------------------------------
log_level: INFO                # DEBUG 로 바꾸면 매칭 과정이 상세히 찍힘
api:
  timeout: 30                  # 초. data.go.kr 응답이 느릴 때 늘리세요
  max_retries: 5
  retry_delay: 20              # 초
