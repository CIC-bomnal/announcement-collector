# =============================================================================
# 공고 수집기 설정 파일
# -----------------------------------------------------------------------------
# 이 파일 하나만 고치면 됩니다. API 키와 서비스 계정 키는 여기에 적지 말고
# GitHub Secrets(또는 로컬 .env)에 넣으세요. → README.md "설정" 참고
#
# 값 우선순위: 환경변수 > 이 파일 > 코드 기본값
# =============================================================================

# ---------------------------------------------------------------------------
# 1. 결과를 기록할 Google 스프레드시트
#    - 시트 URL 전체를 붙여넣어도 되고, ID만 적어도 됩니다.
#    - 서비스 계정 이메일(client_email)에 "편집자" 권한으로 공유해야 합니다.
# ---------------------------------------------------------------------------
spreadsheet: "https://docs.google.com/spreadsheets/d/여기에_스프레드시트_ID/edit"

# ---------------------------------------------------------------------------
# 2. 검색어 (공고 제목 기준, 띄어쓰기·대소문자 무시)
#    4단계로 나뉘며 위에서부터 순서대로 판정합니다.
# ---------------------------------------------------------------------------
keywords:
  # 필수: 하나라도 포함되면 무조건 수집
  must:
    - 주관기관
    - 수행기관
    - 액셀러레이팅

  # 끝부분: 제목이 이 단어로 끝나면 무조건 수집
  ends_with:
    - 운영용역

  # 일반: 하나라도 포함되면 수집
  general:
    - 스타트업
    - 창업
    - 벤처
    - 액셀러레이터
    - 사업화

  # 조건부: 이 단어만 단독으로 있으면 수집하지 않음
  #        (위 필수/끝부분/일반 중 하나와 같이 있을 때만 수집)
  conditional:
    - 소상공인
    - 활성화

# ---------------------------------------------------------------------------
# 3. 금지어 (제목에 포함되면 "(필터)" 탭에서 제외, 원본 탭에는 남김)
# ---------------------------------------------------------------------------
exclusion_keywords:
  - 참가자모집
  - 입주기업

# ---------------------------------------------------------------------------
# 4. 기간 기준
# ---------------------------------------------------------------------------
# 마감일이 오늘로부터 최소 며칠 이상 남은 공고만 수집 (시트에서도 이 기준 미만은 자동 삭제)
min_days_remaining: 7

# 오늘로부터 며칠 전에 등록된 공고까지 조회할지 (클수록 느려짐, 30~90 권장)
search_days_back: 30

# ---------------------------------------------------------------------------
# 5. 수집 소스
# ---------------------------------------------------------------------------
sources:
  nara:                        # 나라장터 (조달청 입찰공고)
    enabled: true
  kstartup:                    # K-Startup (창업진흥원 지원사업 공고)
    enabled: true

# ---------------------------------------------------------------------------
# 6. 시트 탭 이름
# ---------------------------------------------------------------------------
sheets:
  nara: "나라장터"
  kstartup: "K-Startup"
  nara_filtered: "나라장터(필터)"
  kstartup_filtered: "K-Startup(필터)"

# ---------------------------------------------------------------------------
# 7. 기타
# ---------------------------------------------------------------------------
log_level: INFO                # DEBUG 로 바꾸면 매칭 과정이 상세히 찍힘
api:
  timeout: 30                  # 초. data.go.kr 응답이 느릴 때 늘리세요
  max_retries: 5
  retry_delay: 20              # 초
