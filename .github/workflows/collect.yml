name: 공고 수집

on:
  schedule:
    # UTC 기준. 아래는 매일 KST 09:00 (= UTC 00:00).
    # GitHub 는 예약 시각보다 수십 분 늦게 시작하는 일이 흔합니다.
    # 하루 2회로 늘리려면 줄을 추가: 예) '0 5 * * *' (KST 14:00)
    # 평일만: '0 0 * * 1-5'
    - cron: '0 0 * * *'
  workflow_dispatch:   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

# 같은 워크플로우가 겹쳐 돌면 시트가 꼬일 수 있어 동시 실행 금지
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  # 예약 실행 시작일. 이 날짜(KST) 전의 예약 실행은 건너뜁니다.
  # 수동 실행(Run workflow)은 날짜와 무관하게 항상 돕니다.
  # 더 이상 필요 없으면 이 job 과 아래 collect 의 needs/if 두 줄을 지우면 됩니다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          START_DATE: '20260928'   # 2026-09-28 (월) 부터
        run: |
          today=$(TZ=Asia/Seoul date +%Y%m%d)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$today" -lt "$START_DATE" ]; then
            echo "오늘(KST $today)은 시작일($START_DATE) 전이라 건너뜁니다."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # ── Secrets (Settings → Secrets and variables → Actions → Secrets) ──
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      # 소스별로 다른 키를 쓸 때만 (보통 비워둠)
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
      # 슬랙 알림을 쓸 때만 (config.yaml 의 slack.enabled: true 와 함께)
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # ── Variables (같은 화면의 Variables 탭). config.yaml 보다 우선. 보통 비워둠 ──
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || secrets.GOOGLE_SHEET_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        id: run1
        continue-on-error: true
        env:
          SLACK_NOTIFY_ON_FAILURE: 'false'   # 1차 실패는 조용히, 재시도까지 실패하면 알림
        run: python main.py

      # data.go.kr 이 간헐적으로 응답하지 않을 때가 있어 5분 뒤 한 번 더 시도
      - name: 재시도 대기
        if: steps.run1.outcome == 'failure'
        run: sleep 300

      - name: 수집 재시도
        if: steps.run1.outcome == 'failure'
        run: python main.py
